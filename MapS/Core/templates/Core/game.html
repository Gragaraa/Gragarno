{% extends 'Core/base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

<style>
    .game-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 60px);
        width: 100%;
        overflow: hidden;
    }

    #panorama {
        height: 50%;
        width: 100%;
        background: #000;
    }

    #game-map {
        height: 50%;
        width: 100%;
        z-index: 1;
    }

    /* Убираем конфликты стилей для тайлов карты */
    .leaflet-tile-container img {
        box-shadow: none !important;
        border-radius: 0 !important;
    }

    .result-overlay {
        display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: white; padding: 30px; border-radius: 15px; z-index: 9999; text-align: center;
        box-shadow: 0 0 30px rgba(0,0,0,0.5); width: 300px;
    }
</style>
{% endblock %}

{% block content %}
{% if error %}
    <div style="padding: 50px; text-align: center;">
        <h2>{{ error }}</h2>
        <p>Запустите команду <code>python manage.py setup_game</code> в консоли.</p>
    </div>
{% else %}
<div class="game-container">
    <div id="panorama"></div>
    <div id="game-map"></div>
</div>

<div id="result" class="result-overlay">
    <h2 id="res-text"></h2>
    <p id="res-sub"></p>
    <button onclick="location.reload()" style="padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;">Играть дальше</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var panoramaSource = "";
    {% if target.panorama_file %}
        panoramaSource = "{{ target.panorama_file.url }}";
    {% else %}
        panoramaSource = "{{ target.panorama_url }}";
    {% endif %}

    if (panoramaSource) {
        pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": panoramaSource,
            "autoLoad": true
        });
    }



    var map = L.map('game-map', {
        fadeAnimation: false,
        zoomAnimation: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);


    setTimeout(function(){
        map.invalidateSize(true);
    }, 200);


    {% for visit in past_guesses %}
        L.circleMarker([{{ visit.location.lat }}, {{ visit.location.lon }}], {
            radius: 5,
            color: 'blue',
            fillOpacity: 0.5
        }).addTo(map);
    {% endfor %}

    let canGuess = true;
    map.on('click', function(e) {
        if (!canGuess) return;
        canGuess = false;

        fetch("{% url 'submit_guess' %}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({
                target_id: "{{ target.id }}",
                lat: e.latlng.lat,
                lon: e.latlng.lng
            })
        })
        .then(res => res.json())
        .then(data => {

            L.marker([data.t_lat, data.t_lon]).addTo(map).bindPopup("Было здесь!").openPopup();
            L.polyline([[e.latlng.lat, e.latlng.lng], [data.t_lat, data.t_lon]], {
                color: 'red',
                weight: 3,
                dashArray: '10, 10'
            }).addTo(map);


            var group = new L.featureGroup([
                L.marker([e.latlng.lat, e.latlng.lng]),
                L.marker([data.t_lat, data.t_lon])
            ]);
            map.fitBounds(group.getBounds().pad(0.2));

            document.getElementById('result').style.display = 'block';
            document.getElementById('res-text').innerText = `Промах: ${data.dist} км`;
            document.getElementById('res-sub').innerText = `Заработано: ${data.xp} XP`;
        });
    });
</script>
{% endif %}
{% endblock %}
