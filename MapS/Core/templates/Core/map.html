{% extends 'Core/base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<style>
    .map-layout { display: flex; height: calc(100vh - 80px); gap: 10px; }
    #map { flex: 3; border-radius: 10px; }
    .sidebar { flex: 1; background: white; padding: 20px; overflow-y: auto; border-radius: 10px; box-shadow: -2px 0 5px rgba(0,0,0,0.1); }
    .visit-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { color: red; cursor: pointer; font-size: 0.8rem; }
</style>
{% endblock %}

{% block content %}
<div class="map-layout">
    <div id="map"></div>
    <div class="sidebar">
        <h3>Мои места</h3>
        <div id="visit-list">
            {% for visit in user_visits %}
            <div class="visit-item" id="visit-{{ visit.id }}">
                <div>
                    <strong>{{ visit.location.name }}</strong><br>
                    <small>{{ visit.notes|truncatechars:30 }}</small>
                </div>
                <span class="btn-delete" onclick="deletePoint({{ visit.id }})">❌</span>
            </div>
            {% endfor %}
        </div>
        <hr>
        <h4>Новый маршрут</h4>
        <input type="text" id="route-name" placeholder="Название" style="width:100%; margin-bottom:10px;">
        <ul id="selected-points-list" style="font-size: 0.8rem; color: #555; padding-left: 20px;">
            </ul>
        <textarea id="route-description" placeholder="Описание вашего путешествия" style="width:100%; margin-bottom:10px;" rows="3"></textarea>
        <button onclick="saveRoute()" style="width:100%; background:#2ecc71; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">
            Сохранить маршрут
        </button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
    var map = L.map('map').setView([55.75, 37.61], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        // --- ИНИЦИАЛИЗАЦИЯ ПОИСКА ---
    var geocoder = L.Control.geocoder({
        defaultMarkGeocode: false, // Отключаем стандартный маркер, будем юзать свой
        placeholder: "Поиск мест...",
        errorMessage: "Ничего не найдено"
    })
    .on('markgeocode', function(e) {
        var bbox = e.geocode.bbox;
        var center = e.geocode.center;
        var name = e.geocode.name;

        // Плавно перемещаемся к найденному месту
        map.fitBounds(bbox);

        // Создаем временный маркер с предложением сохранить
        let tempMarker = L.marker(center).addTo(map)
            .bindPopup(`<b>${name}</b><br><button onclick="confirmSearchSave(${center.lat}, ${center.lng}, '${name.replace(/'/g, "\\")}')">Сохранить это место</button>`)
            .openPopup();
    })
    .addTo(map);

    // Функция для сохранения из поиска (вызывается из попапа выше)
    function confirmSearchSave(lat, lon, name) {
        if (!confirm("Добавить это место в 'Мои места'?")) return;

        fetch("{% url 'save_location' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ lat: lat, lon: lon, name: name })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') location.reload();
        });
    }
    // --- КОНЕЦ ПОИСКА ---


    let selectedPoints = []; // Массив для временного хранения точек маршрута
    var routingControl = null; // Контроллер маршрутов

function updateRouting() {
    // Если точек меньше 2, роутинг не строим
    if (selectedPoints.length < 2) {
        if (routingControl) {
            map.removeControl(routingControl);
            routingControl = null;
        }
        return;
    }

    // Преобразуем наши точки в формат Leaflet LatLng
    let waypoints = selectedPoints.map(p => L.latLng(p.lat, p.lon));

    if (routingControl) {
        routingControl.setWaypoints(waypoints);
    } else {
        routingControl = L.Routing.control({
            waypoints: waypoints,
            lineOptions: {
                styles: [{ color: '#3498db', weight: 6, opacity: 0.8 }] // Красивая синяя линия
            },
            createMarker: function() { return null; }, // Не плодим лишние маркеры, они у нас уже есть
            addWaypoints: false, // Запрещаем юзеру тыкать в саму линию (управляем только через список)
            routeWhileDragging: false,
            show: false // Скрываем текстовую инструкцию (поверните направо и т.д.)
        }).addTo(map);
    }
}


    // 1. Создание новой точки по клику на карту
    map.on('click', function(e) {
        let name = prompt("Название места:");
        if (!name) return;

        fetch("{% url 'save_location' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ lat: e.latlng.lat, lon: e.latlng.lng, name: name })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') location.reload();
        });
    });

    // 2. Отрисовка маркеров из базы
    {% for visit in user_visits %}
        (function() {
            let lat = {{ visit.location.lat }};
            let lon = {{ visit.location.lon }};
            let name = "{{ visit.location.name }}";

            let m = L.marker([lat, lon]).addTo(map);

            // Создаем контент для попапа
            let container = document.createElement('div');
            container.innerHTML = `<b>${name}</b><br>`;

            let btn = document.createElement('button');
            btn.innerText = "В маршрут";
            btn.style.marginTop = "5px";
            btn.onclick = function() {
                addToRoute(lat, lon, name);
            };

            container.appendChild(btn);
            m.bindPopup(container);
        })();
    {% endfor %}

    // 3. Функция добавления в массив
function addToRoute(lat, lon, name) {
    // Теперь сохраняем полные данные, а не только имя
    selectedPoints.push({lat: lat, lon: lon, name: name});

    let list = document.getElementById('selected-points-list');
    let li = document.createElement('li');
    li.innerText = name;
    list.appendChild(li);

    // Обновляем линию на карте
    updateRouting();
}

    // 4. Отправка на сервер
    function saveRoute() {
    const name = document.getElementById('route-name').value;

    const desc = document.getElementById('route-description').value;

    if (!name) return alert("Введите название маршрута!");
    if (selectedPoints.length < 2) return alert("Нужно выбрать хотя бы 2 точки!");

    console.log("Отправка данных:", { name: name, description: desc, points: selectedPoints });

    fetch("{% url 'create_route' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            name: name,
            description: desc, 
            points: selectedPoints
        })
    })
    .then(response => {
        if (!response.ok) throw new Error('Ошибка сервера: ' + response.status);
        return response.json();
    })
    .then(data => {
        alert("Маршрут успешно создан!");
        window.location.href = "{% url 'routes_list' %}";
    })
    .catch(error => {
        console.error("Критическая ошибка:", error);
        alert("Не удалось сохранить: " + error.message);
    });
}

</script>



{% endblock %}
