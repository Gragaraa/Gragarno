{% extends 'Core/base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<style>
    #map { height: 500px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #eee; }
    .route-info { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
</style>
{% endblock %}

{% block content %}
<div class="route-info">
    <h1>Маршрут: {{ route.name }} 🗺️</h1>
    <p style="color: #666; font-style: italic;">{{ route.description|default:"Без описания" }}</p>

    <div id="map"></div>

    <div style="margin-top: 15px;">
        <a href="{% url 'routes_list' %}" style="display: inline-block; padding: 10px 20px; background: #3498db; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">← К списку маршрутов</a>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
    // Инициализация карты
    // Используем координаты первой точки для центра
    var points = {{ route.points_json|safe }};

    if (points.length > 0) {
        var map = L.map('map').setView([points[0].lat, points[0].lon], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var waypoints = points.map(p => L.latLng(p.lat, p.lon));

        L.Routing.control({
            waypoints: waypoints,
            lineOptions: {
                styles: [{ color: '#e74c3c', weight: 6, opacity: 0.9 }]
            },
            createMarker: function(i, wp) {
                // Добавляем красивые маркеры с именами точек
                return L.marker(wp.latLng).bindPopup("<b>" + points[i].name + "</b>");
            },
            addWaypoints: false,
            draggableWaypoints: false,
            routeWhileDragging: false,
            show: true // Показывает текстовый список поворотов (можно поставить false)
        }).addTo(map);
    } else {
        document.getElementById('map').innerHTML = "<h3>В этом маршруте нет точек :(</h3>";
    }
</script>
{% endblock %}
