<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путешествия с картой</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .hero-content {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        h1 { font-size: 3.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; margin-bottom: 30px; }
        .btn-group { display: flex; gap: 20px; justify-content: center; }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-reg { background-color: #28a745; color: white; }
        .btn-reg:hover { background-color: #218838; transform: scale(1.05); }
        .btn-login { background-color: white; color: #333; }
        .btn-login:hover { background-color: #f8f9fa; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="hero-content">
        <h1>Карта твоих открытий</h1>
        <p>Отмечай города, строй маршруты и получай достижения за каждое путешествие!</p>

        <div class="btn-group">
            {% if user.is_authenticated %}
                <p>Добро пожаловать, {{ user.username }}!</p>
                <a href="{% url 'map_page' %}" class="btn btn-login">Перейти к карте</a>
                <a href="{% url 'profile' %}" class="btn btn-login">Личный кабинет</a>
                <a href="{% url 'logout' %}" style="color: #ff4d4d; margin-left: 15px;">Выйти</a>
            {% else %}
                <a href="{% url 'register' %}" class="btn btn-reg">Начать бесплатно</a>
                <a href="{%url 'login' %}" class="btn btn-login">Войти</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
