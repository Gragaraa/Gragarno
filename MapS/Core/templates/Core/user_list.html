{% extends 'Core/base.html' %}
{% block content %}
<style>
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .user-card {
        background: white; padding: 20px; border-radius: 15px; text-align: center;
        transition: 0.3s; border: 1px solid #eee; text-decoration: none; color: inherit;
    }
    .user-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .avatar-mid { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
</style>

<div class="ach-header">
    <h1>👥 Исследователи мира</h1>
    <p>Всего в системе: {{ users.count }} путешественников</p>
</div>

<div class="user-grid">
    {% for u in users %}
    <a href="{% url 'profile' %}?id={{u.id}}" class="user-card"> 
        {% if u.avatar %}
            <img src="{{ u.avatar.url }}" class="avatar-mid">
        {% else %}
            <div class="avatar-mid" style="background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 10px;">
                {{ u.username|first|upper }}
            </div>
        {% endif %}
        <h3>{{ u.username }}</h3>
        <span class="badge">{{ u.title }}</span>
        <div style="color: #2ecc71; font-weight: bold; margin-top: 5px;">{{ u.level }} LVL</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
