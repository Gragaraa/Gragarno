<!DOCTYPE html>
<html>
<head>
    <style>
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; font-family: sans-serif; text-align: center; }
        .code { font-size: 32px; font-weight: bold; color: #2ecc71; letter-spacing: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Привет, {{ user.username }}! 👋</h2>
        <p>Добро пожаловать в MapS. Чтобы завершить регистрацию, введи этот код на сайте:</p>
        <div class="code">{{ code }}</div>
        <p>Если ты не регистрировался у нас, просто проигнорируй это письмо.</p>
    </div>
</body>
</html>
