<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | Путешествия с картой</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content:center;
            padding-top: 50px;
            }
        .reg-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            }
        h2 {
            text-align: center;
            color: #333;
            }
        .form-group {
            margin-bottom: 15px;
            }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px; }
        button:hover {
            background: #218838;
            }
        .errorlist {
            color: red;
            font-size: 0.9em;
            list-style: none;
            padding: 0;
            }
    </style>
</head>
<body>
    <div class="reg-container">
        <h2>Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Создать аккаунт</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Уже есть аккаунт? <a href="{% url 'login'%}">Войти</a>
        </p>
    </div>
</body>
</html>
