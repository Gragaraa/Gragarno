{% extends 'Core/base_auth.html' %}

{% block content %}
<div style="max-width: 450px; margin: 60px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;">
    <h2 style="color: #2c3e50; margin-bottom: 15px;">Новый пароль 🔐</h2>
    <p style="color: #7f8c8d; margin-bottom: 25px;">Введите 6-значный код из письма и ваш новый пароль.</p>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Код подтверждения:</label>
            <input type="text" name="code" maxlength="6" required placeholder="000000" 
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.2rem; text-align: center; letter-spacing: 4px;">
        </div>

        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Придумайте новый пароль:</label>
            <input type="password" name="password" required 
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;">
        </div>

        <button type="submit" style="width: 100%; background: #2ecc71; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; cursor: pointer;">
            Обновить пароль
        </button>
    </form>
</div>
{% endblock %}
