{% extends 'Core/base_auth.html' %}

{% block content %}
<div style="max-width: 450px; margin: 60px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;">
    <h2 style="color: #2c3e50; margin-bottom: 15px;">Восстановление доступа 🔑</h2>
    <p style="color: #7f8c8d; margin-bottom: 25px;">Введите Email, указанный при регистрации. Мы отправим код для сброса пароля в ваш <b>Mailtrap</b>.</p>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Ваша почта:</label>
            <input type="email" name="email" required placeholder="example@mail.com" 
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;">
        </div>
        <button type="submit" style="width: 100%; background: #3498db; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.3s;">
            Получить код
        </button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="{% url 'login' %}" style="color: #7f8c8d; text-decoration: none; font-size: 0.9rem;">← Вернуться к входу</a>
    </div>
</div>
{% endblock %}
